apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventflow
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eventflow
  template:
    metadata:
      labels:
        app: eventflow
    spec:
      containers:
      - name: eventflow
        image: eventflow:0.2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10