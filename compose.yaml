name: platform-engineering-lab

services:
  eventflow:
    build: .
    ports:
      - "127.0.0.1:${EVENTFLOW_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  db-init:
    image: postgres:16
    environment:
      PGHOST: ${POSTGRES_HOST:-data-engineering-postgres}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGDATABASE: ${POSTGRES_DB:-data_engineering}
      PGUSER: ${POSTGRES_USER:-pipeline_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGCONNECT_TIMEOUT: "5"
    volumes:
      - ./database/init/001_security_events.sql:/init/001_security_events.sql:ro
      - ./database/migrations/002_source_event_id.sql:/init/002_source_event_id.sql:ro
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/init/001_security_events.sql", "-f", "/init/002_source_event_id.sql"]
    networks:
      - database
    restart: "no"

  log-ingestor:
    build: ./services/log-ingestor
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-data-engineering-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-data_engineering}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${LOG_INGESTOR_PORT:-8002}:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - database
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - default
      - database
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  prometheus_data:
  grafana_data:

networks:
  database:
    external: true
    name: ${POSTGRES_NETWORK:-data-engineering-lab_default}
